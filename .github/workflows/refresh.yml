
name: Refresh proxy lists
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
    
permissions:
  contents: write

concurrency:
  group: proxy-harvester-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
      PUBLISH_OUTPUTS: ${{ secrets.PUBLISH_OUTPUTS }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Xray and sing-box
        run: python scripts/install_cores.py --output tools

      - name: Collect, filter and verify proxies
        run: |
          python proxy_harvester.py \
            --core both \
            --xray-bin tools/xray \
            --singbox-bin tools/sing-box \
            --workers 4

      - name: Upload proxy lists and report
        uses: actions/upload-artifact@v4
        with:
          name: proxy-lists-${{ github.run_number }}
          path: output/
          if-no-files-found: error
          retention-days: 7

      - name: Publish output files to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f output/

          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified proxy lists"
            git push
          else
            echo "No output changes to publish."
          fi
